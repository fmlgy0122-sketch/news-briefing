<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>뉴스 브리핑</title>
<style>
  :root{--bg:#111827;--card:#1f2937;--fg:#f9fafb;--mute:#9ca3af;--acc:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans KR",sans-serif;padding:20px 16px 40px;max-width:520px;margin-inline:auto}
  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--mute);font-size:14px;margin-bottom:20px}
  #play{width:100%;padding:28px;font-size:24px;font-weight:700;border:0;border-radius:20px;background:var(--acc);color:#04202e}
  audio{width:100%;margin:16px 0}
  .row{display:flex;gap:8px;margin-bottom:20px}
  .row button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--card);color:var(--fg);font-size:15px}
  .row button.on{background:var(--acc);color:#04202e}
  ul{list-style:none;padding:0;margin:0} li{background:var(--card);border-radius:12px;padding:14px;margin-bottom:8px}
  li b{display:block} li span{color:var(--mute);font-size:13px}
  li .top{display:flex;align-items:center;gap:8px;justify-content:space-between} li .top div{flex:1;min-width:0}
  .sbtn{border:0;border-radius:10px;background:#374151;color:var(--fg);padding:8px 12px;font-size:13px;white-space:nowrap}
  .st{white-space:pre-wrap;word-break:keep-all;line-height:1.7;font-size:14px;margin:12px 0 0;padding:12px;background:#111827;border-radius:10px;max-height:60vh;overflow:auto}
</style>
</head>
<body>
<h1>뉴스 브리핑</h1>
<div class="sub" id="info">불러오는 중…</div>
<div class="row" id="versions"><button data-v="short">간략 · 5분 이하</button><button data-v="full" class="on">풀 · 10~15분</button></div>
<button id="play">▶ 선택한 뉴스 듣기</button>
<div class="sub" id="notice">오전 6시 정기 방송 · 이후 요청 방송은 별도 생성 후 목록에 표시됩니다.</div>
<audio id="a" controls preload="none"></audio>
<div class="row" id="speeds"></div>
<ul id="list"></ul>
<script>
const a=document.getElementById('a'),info=document.getElementById('info'),list=document.getElementById('list');
let eps=[],selected='full';
const version=e=>e.version||(e.duration<=300?'short':'full');
const kind=e=>version(e)==='short'?'간략 버전':'풀 버전';
const title=e=>e.title.replace('직접 작성 브리핑', '종합 뉴스 '+kind(e));
function pick(){const matched=eps.filter(e=>version(e)===selected);return matched[0]||eps[0]}
function highlight(){document.querySelectorAll('#versions button').forEach(b=>b.classList.toggle('on',b.dataset.v===selected))}
const fmt=s=>Math.floor(s/60)+'분';
function load(ep){
  a.src=ep.file;
  info.textContent=title(ep)+' · 약 '+fmt(ep.duration);
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:title(ep),artist:'UNICUBE CEO 뉴스'});
    navigator.mediaSession.setActionHandler('seekbackward',()=>a.currentTime-=15);
    navigator.mediaSession.setActionHandler('seekforward',()=>a.currentTime+=30);
  }
}
async function init(){
  try{
    eps=await (await fetch('episodes.json',{cache:'no-store'})).json();
    load(pick());
    list.innerHTML=eps.map((e,i)=>`<li data-i="${i}"><div class="top"><div><b>${title(e)}</b><span>약 ${fmt(e.duration)}</span></div>${e.script?'<button class="sbtn" data-s="1">원고 보기</button>':''}</div></li>`).join('');
    if(new URLSearchParams(location.search).has('autoplay'))a.play().catch(()=>{});
  }catch(e){info.textContent='에피소드를 불러오지 못했습니다.'}
}
document.getElementById('versions').onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;selected=b.dataset.v;highlight();if(eps.length){a.pause();load(pick());}};
document.getElementById('play').onclick=()=>{ if(!a.src)return; if(a.paused)a.play(); else a.pause(); };
a.onplay=()=>document.getElementById('play').textContent='⏸ 일시정지';
a.onpause=()=>document.getElementById('play').textContent='▶ 선택한 뉴스 듣기';
list.onclick=async e=>{
  const li=e.target.closest('li');if(!li)return;
  if(e.target.dataset.s){
    let pre=li.querySelector('.st');
    if(pre){pre.remove();e.target.textContent='원고 보기';return}
    pre=document.createElement('pre');pre.className='st';pre.textContent='불러오는 중…';li.appendChild(pre);
    e.target.textContent='원고 닫기';
    try{pre.textContent=await (await fetch(eps[li.dataset.i].script,{cache:'no-store'})).text()}
    catch(_){pre.textContent='원고를 불러오지 못했습니다.'}
    return;
  }
  load(eps[li.dataset.i]);a.play()};
const sp=document.getElementById('speeds');
[1,1.25,1.5,2].forEach(v=>{const b=document.createElement('button');b.textContent=v+'x';if(v===1)b.className='on';
  b.onclick=()=>{a.playbackRate=v;[...sp.children].forEach(c=>c.className='');b.className='on'};sp.appendChild(b)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
init();
</script>
</body>
</html>
