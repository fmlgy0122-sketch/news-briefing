name: build-news-audio

# RSS 자동 수집은 중단했습니다. 메일로 받은 원고(manual/today.txt)가 올라올 때만 방송을 만듭니다.
# (필요하면 Actions 탭에서 Run workflow 로 RSS 방송을 직접 만들 수 있습니다.)
on:
  workflow_dispatch:
  push:
    paths:
      - "manual/today.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.b.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - id: b
        run: python build.py
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          MANUAL_BUILD: ${{ github.event_name == 'push' && '1' || '0' }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - if: steps.b.outputs.build == 'true'
        uses: actions/configure-pages@v5
      - if: steps.b.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
